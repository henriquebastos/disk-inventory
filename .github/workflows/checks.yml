name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # A newer push replaces the run of a pull request; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Xcode 27 on macOS 27, Apple silicon. The macos-26 image has Xcode 26 only.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run scripts/check.sh model
        env:
          CHECK_ROOT: ${{ runner.temp }}/check
        run: scripts/check.sh model
      - name: Keep the check logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs
          path: ${{ runner.temp }}/check/logs
          retention-days: 14
